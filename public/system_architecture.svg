      .title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #E6EDF7; }
      .subtitle { font-family: 'Inter', sans-serif; font-weight: 500; fill: #8892A6; }
      .layer-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; }
      .layer-sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; fill: #8892A6; }
      .card-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; fill: #E6EDF7; }
      .card-sub { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #8892A6; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .arrow-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #19C6FF; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#19C6FF"/>
    </marker>
